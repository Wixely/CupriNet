# Lodestar with Tor — dual-stack: reachable over BOTH clearnet and its .onion at the same time. The link
# carries both, so clearnet peers dial the public address and Tor peers dial the onion. This is the
# recommended way to add Tor to a public keep-alive node (maximum reachability). The image is the same as
# clearnet — Tor is a managed client baked in, enabled by config.
#
#   docker compose -f docker-compose.tor.yml up -d
#   docker compose -f docker-compose.tor.yml logs -f     # clearnet link now; the .onion is added once Tor bootstraps
#
# To run ONION-ONLY instead (hide the node's IP; reachable only by Tor peers), set TorOnly=true and drop the
# published overlay port (inbound then arrives solely over the onion). See the commented lines below.

services:
  lodestar:
    image: ghcr.io/wixely/cuprinet-lodestar:latest
    # build:
    #   context: ../../..
    #   dockerfile: node/CupriNet.Lodestar/Dockerfile
    #   secrets: [packages_token]
    container_name: cuprinet-lodestar-tor
    restart: unless-stopped
    ports:
      - "43820:43820"     # overlay (clearnet half) — omit this for onion-only
      - "8080:8080"       # status page (shows both the clearnet link and the .onion)
    volumes:
      - lodestar-tor-data:/data   # hot path incl. the persistent onion key, so the .onion survives restarts
    environment:
      CUPRINET_LODESTAR_Concordium: "example.chat"
      CUPRINET_LODESTAR_EnableTor: "true"                   # clearnet + onion (dual-stack)
      CUPRINET_LODESTAR_PublicHost: "lodestar.example.net"  # <-- your reachable clearnet address
      CUPRINET_LODESTAR_EnableWeb: "true"
      # --- onion-only variant (hide the IP): uncomment, and remove the 43820 port mapping above ---
      # CUPRINET_LODESTAR_TorOnly: "true"
      # CUPRINET_LODESTAR_EnableCoverTraffic: "true"        # optional decoy traffic over Tor (extra bandwidth)
      # CUPRINET_LODESTAR_SEEDS: "cuprinet://intone/AAA…"

volumes:
  lodestar-tor-data:

# secrets:
#   packages_token:
#     environment: PACKAGES_TOKEN
