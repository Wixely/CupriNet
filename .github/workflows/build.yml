name: build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to attach assets to a release on tag builds
  packages: read    # read CupriMark (core) + CupriTor (CupriChatLite) from the Wixely GitHub Packages feed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  # ---------------------------------------------------------------------------
  # Build + run the full test suite — the authoritative "does it build and pass"
  # gate. The core now depends on CupriMark (version negotiation) from the Wixely
  # GitHub Packages feed, so this authenticates that feed with PACKAGES_TOKEN
  # (an org read:packages PAT) or the workflow token.
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Authenticate to the Wixely feed (CupriMark is a core dependency)
        shell: bash
        run: >
          dotnet nuget update source GitHub-Wixely-Packages
          --username ${{ github.actor }}
          --password "${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}"
          --store-password-in-clear-text
          --configfile nuget.config
      - name: Test (core library + full suite)
        run: dotnet test tests/CupriNet.UnitTests/CupriNet.UnitTests.csproj -c Release

  # ---------------------------------------------------------------------------
  # NuGet packages for the core library (all src/ projects, one shared version)
  # plus a zip of the managed library binaries.
  # ---------------------------------------------------------------------------
  pack:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Authenticate to the Wixely feed (CupriMark is a core dependency)
        shell: bash
        run: >
          dotnet nuget update source GitHub-Wixely-Packages
          --username ${{ github.actor }}
          --password "${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}"
          --store-password-in-clear-text
          --configfile nuget.config
      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.1.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi
      - name: Pack core packages (skips CupriNet.Tor, which needs the CupriTor feed)
        shell: bash
        run: |
          for proj in src/*/*.csproj; do
            case "$proj" in */CupriNet.Tor.csproj) echo "skipping $proj (needs CupriTor feed)"; continue;; esac
            dotnet pack "$proj" -c Release -p:Version=${{ steps.ver.outputs.version }} -o artifacts/nuget
          done
      - name: Publish managed library binaries
        run: dotnet publish src/CupriNet.Hosting/CupriNet.Hosting.csproj -c Release -p:Version=${{ steps.ver.outputs.version }} -o artifacts/lib
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg
      - uses: actions/upload-artifact@v4
        with:
          name: cuprinet-library
          path: artifacts/lib

  # ---------------------------------------------------------------------------
  # Downloadable CupriChatLite executables: one self-contained single file per OS.
  # CupriChatLite depends on the CupriTor package (private Wixely feed), so this job
  # is BEST-EFFORT: it authenticates with the workflow token (or a PACKAGES_TOKEN
  # secret) and does not fail the pipeline if that feed access isn't configured.
  # ---------------------------------------------------------------------------
  publish-app:
    needs: test
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Authenticate to the CupriTor feed
        shell: bash
        run: >
          dotnet nuget update source GitHub-Wixely-Packages
          --username ${{ github.actor }}
          --password "${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}"
          --store-password-in-clear-text
          --configfile nuget.config

      - name: Publish CupriChatLite (self-contained single file)
        shell: bash
        run: >
          dotnet publish samples/CupriChatLite/CupriChatLite.csproj -c Release -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o out/app

      - name: Install NativeAOT prerequisites (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish CupriChatLite (NativeAOT, best-effort)
        id: aot
        continue-on-error: true
        shell: bash
        run: >
          dotnet publish samples/CupriChatLite/CupriChatLite.csproj -c Release -r ${{ matrix.rid }}
          -p:PublishAot=true
          -p:TreatWarningsAsErrors=false
          -p:DebugType=none
          -o out/aot

      - name: Upload single-file app
        uses: actions/upload-artifact@v4
        with:
          name: cuprichatlite-${{ matrix.rid }}
          path: out/app

      - name: Upload NativeAOT app (only if it built)
        if: steps.aot.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: cuprichatlite-aot-${{ matrix.rid }}
          path: out/aot

  # ---------------------------------------------------------------------------
  # Downloadable Lodestar (headless overlay node) executables: self-contained
  # single file per OS, for Ubuntu and Windows.
  # ---------------------------------------------------------------------------
  publish-lodestar:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Authenticate to the Wixely feed (CupriMark is a core dependency)
        shell: bash
        run: >
          dotnet nuget update source GitHub-Wixely-Packages
          --username ${{ github.actor }}
          --password "${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}"
          --store-password-in-clear-text
          --configfile nuget.config

      - name: Publish Lodestar (self-contained single file)
        shell: bash
        run: >
          dotnet publish node/CupriNet.Lodestar/CupriNet.Lodestar.csproj -c Release -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o out/lodestar

      - name: Bundle deploy helpers (per-OS)
        shell: bash
        run: |
          cp node/CupriNet.Lodestar/README.md out/lodestar/ 2>/dev/null || true
          if [ "${{ matrix.rid }}" = "win-x64" ]; then
            cp node/CupriNet.Lodestar/deploy/install-service.ps1   out/lodestar/
            cp node/CupriNet.Lodestar/deploy/uninstall-service.ps1 out/lodestar/
          else
            cp node/CupriNet.Lodestar/deploy/cuprinet-lodestar.service out/lodestar/
          fi
          ls -la out/lodestar

      - name: Upload Lodestar app
        uses: actions/upload-artifact@v4
        with:
          name: lodestar-${{ matrix.rid }}
          path: out/lodestar

  # ---------------------------------------------------------------------------
  # Lodestar container image. Built on every run; pushed to GHCR on a v* tag.
  # ---------------------------------------------------------------------------
  docker-lodestar:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU (emulates the arm64 runtime stage on an amd64 runner)
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx (multi-platform builder)
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR (only when pushing on a tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cuprinet-lodestar
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha
      - name: Build (and push on tag) the Lodestar image
        uses: docker/build-push-action@v6
        env:
          # Don't upload the build-record (.dockerbuild) artifact: the release job downloads ALL artifacts and
          # this metadata blob has been failing that step's download after retries. The release doesn't need it.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: node/CupriNet.Lodestar/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: |
            packages_token=${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # On a v* tag, gather everything into a GitHub Release as downloadable assets.
  # ---------------------------------------------------------------------------
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ pack, publish-app, publish-lodestar, docker-lodestar ]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Assemble release assets
        shell: bash
        run: |
          mkdir -p assets
          cp dist/nuget-packages/*.nupkg assets/ 2>/dev/null || true
          for d in dist/cuprichatlite-* dist/lodestar-* dist/cuprinet-library; do
            [ -d "$d" ] && (cd "$d" && zip -r "$GITHUB_WORKSPACE/assets/$(basename "$d").zip" .)
          done
          ls -la assets
      - name: Create / update the release
        uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          fail_on_unmatched_files: false
